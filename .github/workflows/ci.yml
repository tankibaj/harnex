name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Shell scripts (shellcheck, pinned so local and CI agree)
        run: pipx run --spec shellcheck-py==0.11.0.1 shellcheck scripts/*.sh
      - name: Python (ruff)
        run: pipx run ruff==0.15.11 check scripts skills
      - name: Commit messages are Conventional Commits
        if: github.event_name == 'pull_request'
        run: node scripts/release.mjs --lint origin/${{ github.base_ref }}

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm test

  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Claude Code plugin and marketplace manifests
        run: claude plugin validate .
      - name: skills.sh lists every skill
        run: |
          # Strip colour codes; each skill name is printed on a line of its own.
          out="$(npx -y skills@latest add . --list 2>&1 | sed -E 's/\x1b\[[0-9;?]*[a-zA-Z]//g')"
          for s in harnex pr-review qa retro; do
            grep -qE "[[:space:]]$s[[:space:]]*$" <<<"$out" || { echo "$out"; echo "skills.sh does not list $s"; exit 1; }
          done

  install:
    # Install the way a user would, with each real CLI, in throwaway config dirs.
    name: install (${{ matrix.agent }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: claude
            cli: '@anthropic-ai/claude-code'
          - agent: codex
            cli: '@openai/codex'
          - agent: opencode
            cli: 'opencode-ai'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install -g ${{ matrix.cli }}
      - run: bash scripts/e2e.sh ${{ matrix.agent }}
