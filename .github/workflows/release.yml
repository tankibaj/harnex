name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write

jobs:
  release:
    # The release commit itself pushes to main; don't release it again.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main          # the tip, not the triggering SHA: an earlier run may have pushed a release
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
